services:
  backend:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  frontend:
    build: .
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    command: ["python", "-m", "streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      backend:
        condition: service_healthy
